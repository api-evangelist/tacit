name: Tacit
description: 'Tacit Networks was an early-2000s enterprise networking vendor and one
  of the leading providers of WAN Optimization technology for Wide Area File Services
  (WAFS), letting distributed offices access centralized file servers over the wide
  area network at LAN-like speeds. Backed by Canaan Partners (Series A led by Maha
  Ibrahim), JP Morgan, Chevron Technology Ventures and RRE Ventures, the company was
  acquired by Packeteer in May 2006 (subsequently absorbed into Blue Coat Systems and
  Symantec). It is defunct: it operated no public developer platform, API, or SDK
  surface, so this profile carries company identity only and has no API artifacts to
  enrich.'
